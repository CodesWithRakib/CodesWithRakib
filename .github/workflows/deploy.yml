name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup GitHub Pages metadata
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code Quality - Linter
        run: pnpm run lint

      - name: Code Quality - Typecheck
        run: pnpm run typecheck

      - name: Automated Tests
        run: pnpm test

      - name: Build Next.js static export
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://codeswithrakib.github.io"

      - name: Ensure .nojekyll exists
        run: touch out/.nojekyll

      - name: Verify static build artifacts
        run: |
          test -d out || { echo "Error: out directory missing"; exit 1; }
          test -f out/index.html || { echo "Error: out/index.html missing"; exit 1; }
          test -f out/404.html || { echo "Error: out/404.html missing"; exit 1; }
          test -f out/.nojekyll || { echo "Error: out/.nojekyll missing"; exit 1; }
          test -f out/sitemap.xml || { echo "Error: out/sitemap.xml missing"; exit 1; }
          test -f out/robots.txt || { echo "Error: out/robots.txt missing"; exit 1; }
          echo "All required static export files verified successfully."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
